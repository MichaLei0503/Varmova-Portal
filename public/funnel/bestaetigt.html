<title>Varmova — Bestätigung</title>

<style>@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url("/fonts/inter-var.woff2") format("woff2")}</style>
<style>
  :root{--night:#05070D;--night-90:#11151F;--copper:#E8A260;--copper-30:#C5854A;
    --graphite-40:#B6B5B9;--graphite-60:#908F94;--mist:#D5DBE6;--paper:#FFF;
    --line:rgba(213,219,230,.10);--ease:cubic-bezier(.22,.8,.3,1)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--night);color:var(--mist);font-family:Inter,Arial,sans-serif;
    min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;text-align:center;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;top:-40vmax;left:50%;transform:translateX(-50%);
    width:70vmax;height:70vmax;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(232,162,96,.13) 0%,transparent 65%)}
  .card{position:relative;max-width:560px;width:100%}
  img.logo{height:72px;margin-bottom:36px}
  .badge{width:84px;height:84px;margin:0 auto 28px;border-radius:50%;
    border:1px solid rgba(232,162,96,.4);display:grid;place-items:center;
    background:radial-gradient(circle,rgba(232,162,96,.16),transparent 70%)}
  .badge svg{color:var(--copper)}
  .badge svg path{stroke-dasharray:34;stroke-dashoffset:34;animation:draw .7s .3s var(--ease) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  p.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--copper);font-weight:600;margin:0 0 14px}
  h1{font-weight:400;letter-spacing:-.02em;color:var(--paper);font-size:clamp(1.6rem,1.2rem+2vw,2.2rem);line-height:1.2;margin:0 0 16px}
  h1 b{font-weight:700}
  .sub{color:var(--graphite-40);font-size:1rem;line-height:1.65;margin:0 auto 34px;max-width:460px}
  a.btn{display:inline-block;background:var(--copper);color:var(--night);font-weight:600;
    text-decoration:none;padding:14px 34px;border-radius:999px;transition:background .25s var(--ease)}
  a.btn:hover{background:var(--copper-30)}
  footer{margin-top:60px;font-size:.78rem;color:var(--graphite-60)}
  footer a{color:var(--graphite-60);text-decoration:none;margin:0 12px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important}}
</style>
