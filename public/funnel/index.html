<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varmova — Kontaktanfrage</title>
<meta name="description" content="Varmi anfragen: für Ihr Zuhause oder als Fachpartner. Einfach. Intelligent. Warm.">
<meta name="robots" content="noindex, follow">
<style>@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url("/fonts/inter-var.woff2") format("woff2")}</style>
<style>
  :root{
    --night:#05070D; --night-90:#11151F; --night-80:#1C2030; --night-70:#292E3F;
    --copper:#E8A260; --copper-30:#C5854A; --copper-20:#9E6A39;
    --graphite:#454449; --graphite-60:#908F94; --graphite-40:#B6B5B9;
    --mist:#D5DBE6; --paper:#FFFFFF;
    --line:rgba(213,219,230,.10); --line-strong:rgba(213,219,230,.18);
    --ease:cubic-bezier(.22,.8,.3,1);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--night); color:var(--mist);
    font-family:Inter,Arial,sans-serif; font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased; min-height:100svh; overflow-x:clip;
  }
  /* Subtile Copper-Glows (Signature-Look), sehr langsam driftend */
  .glow{position:fixed; border-radius:50%; pointer-events:none; z-index:0; filter:blur(10px);}
  .glow--a{width:70vmax;height:70vmax; top:-42vmax; left:50%; transform:translateX(-50%);
    background:radial-gradient(circle, rgba(232,162,96,.14) 0%, rgba(232,162,96,.05) 38%, transparent 68%);
    animation:drift-a 26s ease-in-out infinite alternate;}
  .glow--b{width:52vmax;height:52vmax; bottom:-36vmax; right:-18vmax;
    background:radial-gradient(circle, rgba(232,162,96,.07) 0%, transparent 62%);
    animation:drift-b 34s ease-in-out infinite alternate;}
  @keyframes drift-a{from{transform:translateX(-54%) translateY(0)}to{transform:translateX(-46%) translateY(4vmax)}}
  @keyframes drift-b{from{transform:translate(0,0)}to{transform:translate(-5vmax,-4vmax)}}

  .shell{position:relative; z-index:1; width:100%; max-width:960px; margin:0 auto; padding:0 clamp(18px,4vw,40px);}

  /* Header */
  header{display:flex; align-items:center; justify-content:space-between; padding:26px 0 10px;}
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none;}
  .brand img{height:56px; display:block; margin:-8px 0}
  .site-link{
    font-size:.85rem; font-weight:600; color:var(--mist); text-decoration:none;
    padding:9px 20px; border:1px solid var(--line-strong); border-radius:999px;
    transition:background .25s var(--ease), border-color .25s var(--ease);
  }
  .site-link:hover{background:var(--night-90); border-color:var(--graphite-60)}

  /* Fortschritt: Energielinie */
  .progress{margin:26px auto 6px; max-width:520px;}
  .progress__meta{display:flex; justify-content:space-between; font-size:.72rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--graphite-60); margin-bottom:10px;}
  .progress__meta b{color:var(--copper); font-weight:600}
  .progress__track{position:relative; height:2px; background:var(--night-70); border-radius:2px; overflow:visible;}
  .progress__fill{position:absolute; inset:0 auto 0 0; width:0%; border-radius:2px;
    background:linear-gradient(90deg, rgba(232,162,96,.35), var(--copper));
    box-shadow:0 0 12px rgba(232,162,96,.55); transition:width .6s var(--ease);}
  .progress__spark{position:absolute; top:50%; left:0%; width:8px; height:8px; margin:-4px 0 0 -4px;
    border-radius:50%; background:var(--copper); box-shadow:0 0 0 0 rgba(232,162,96,.45);
    animation:spark 2.2s ease-out infinite; transition:left .6s var(--ease);}
  @keyframes spark{0%{box-shadow:0 0 0 0 rgba(232,162,96,.45)}70%{box-shadow:0 0 0 9px rgba(232,162,96,0)}100%{box-shadow:0 0 0 0 rgba(232,162,96,0)}}

  /* Bühne & Step-Transitions */
  main{padding:14px 0 40px; min-height:60svh;}
  .step{display:none;}
  .step.is-active{display:block; animation:step-in .45s var(--ease) both;}
  .step.is-active.from-back{animation-name:step-in-back;}
  @keyframes step-in{from{opacity:0; transform:translateX(28px)}to{opacity:1; transform:none}}
  @keyframes step-in-back{from{opacity:0; transform:translateX(-28px)}to{opacity:1; transform:none}}

  .eyebrow{font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--copper);
    font-weight:600; text-align:center; margin:26px 0 14px;}
  h1,h2{font-weight:400; letter-spacing:-.02em; color:var(--paper); text-align:center;
    font-size:clamp(1.7rem,1.2rem + 2.6vw,2.6rem); line-height:1.18; margin:0 0 14px;}
  h1 b,h2 b{font-weight:700}
  .sub{color:var(--graphite-40); text-align:center; max-width:620px; margin:0 auto 34px; font-size:1.02rem;}

  /* Weiche-Karten */
  .split{display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:8px;}
  .choice-card{
    text-align:left; background:var(--night-90); border:1px solid var(--line); border-radius:20px;
    overflow:hidden; cursor:pointer; padding:0; color:inherit; font:inherit; display:flex; flex-direction:column;
    transition:transform .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease);
  }
  .choice-card:hover{transform:translateY(-5px); border-color:rgba(232,162,96,.45);
    box-shadow:0 24px 60px -24px rgba(0,0,0,.8), 0 0 0 1px rgba(232,162,96,.15);}
  .choice-card:active{transform:translateY(-3px) scale(.985)}
  .choice-card__media{position:relative; aspect-ratio:16/9.5; overflow:hidden;}
  .choice-card__media img{width:100%; height:100%; object-fit:cover; display:block;
    transition:transform 1.2s var(--ease);}
  .choice-card:hover .choice-card__media img{transform:scale(1.045)}
  .choice-card__media::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(5,7,13,0) 45%, rgba(5,7,13,.92) 100%);}
  .choice-card__tag{position:absolute; top:14px; left:14px; z-index:1; font-size:.68rem; font-weight:600;
    letter-spacing:.16em; text-transform:uppercase; color:var(--mist);
    background:rgba(5,7,13,.72); border:1px solid var(--line-strong); padding:6px 12px; border-radius:999px;}
  .choice-card__body{padding:22px 24px 24px; display:flex; flex-direction:column; gap:14px; flex:1;}
  .choice-card__title{font-size:1.22rem; font-weight:700; letter-spacing:-.01em; color:var(--paper); margin:0;}
  .choice-card ul{list-style:none; margin:0; padding:0; display:grid; gap:9px; flex:1;}
  .choice-card li{display:flex; gap:10px; align-items:flex-start; color:var(--graphite-40); font-size:.92rem; line-height:1.45;}
  .choice-card li svg{flex:none; margin-top:2px; color:var(--copper)}
  .choice-card__cta{display:flex; align-items:center; gap:8px; color:var(--copper); font-weight:600; font-size:.95rem;}
  .choice-card__cta svg{transition:transform .3s var(--ease)}
  .choice-card:hover .choice-card__cta svg{transform:translateX(4px)}

  /* Trust-Row */
  .trust{display:flex; justify-content:center; gap:clamp(20px,5vw,56px); margin:40px 0 6px; flex-wrap:wrap;}
  .trust div{text-align:center}
  .trust b{display:block; font-size:1.35rem; font-weight:700; color:var(--paper); letter-spacing:-.01em;}
  .trust span{font-size:.8rem; color:var(--graphite-60)}

  /* Options-Liste (Fragen) */
  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:720px; margin:0 auto;}
  .options--stack{grid-template-columns:1fr; max-width:560px;}
  .option{
    display:flex; align-items:center; gap:14px; text-align:left; width:100%;
    background:var(--night-90); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; color:var(--mist); font:inherit; font-size:.98rem; font-weight:500; cursor:pointer;
    transition:border-color .25s var(--ease), background .25s var(--ease), transform .25s var(--ease);
  }
  .option:hover{border-color:rgba(232,162,96,.5); background:var(--night-80)}
  .option:active{transform:scale(.985)}
  .option__icon{flex:none; width:38px; height:38px; border-radius:10px; display:grid; place-items:center;
    background:var(--night-80); border:1px solid var(--line); color:var(--copper);}
  .option__check{margin-left:auto; flex:none; width:22px; height:22px; border-radius:50%;
    border:1px solid var(--line-strong); display:grid; place-items:center; color:transparent;
    transition:all .25s var(--ease);}
  .option.is-selected{border-color:var(--copper); background:var(--night-80)}
  .option.is-selected .option__check{background:var(--copper); border-color:var(--copper); color:var(--night)}

  /* Formular */
  form{max-width:640px; margin:0 auto;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .field{margin-bottom:18px; text-align:left;}
  .field label{display:block; font-size:.85rem; font-weight:600; color:var(--mist); margin-bottom:7px;}
  .field label small{font-weight:400; color:var(--graphite-60)}
  .field input,.field textarea{
    width:100%; background:var(--night-90); border:1px solid var(--line-strong); border-radius:12px;
    color:var(--paper); font:inherit; font-size:.98rem; padding:13px 16px; outline:none;
    transition:border-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .field input::placeholder,.field textarea::placeholder{color:var(--graphite-60)}
  .field input:focus,.field textarea:focus{border-color:var(--copper); box-shadow:0 0 0 3px rgba(232,162,96,.15)}
  .field.has-error input{border-color:#B5443A}
  .field .error{display:none; font-size:.8rem; color:#D98A83; margin-top:6px;}
  .field.has-error .error{display:block}
  textarea{resize:vertical; min-height:96px}

  .consent{display:flex; gap:12px; align-items:flex-start; margin:6px 0 22px; text-align:left;}
  .consent input{flex:none; width:20px; height:20px; margin-top:2px; accent-color:var(--copper); cursor:pointer;}
  .consent label{font-size:.83rem; color:var(--graphite-40); line-height:1.55; cursor:pointer;}
  .consent a{color:var(--mist); text-decoration:underline}
  .consent.has-error label{color:#D98A83}

  /* Buttons */
  .actions{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:30px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    font:inherit; font-weight:600; font-size:1rem; cursor:pointer; border-radius:999px;
    padding:15px 34px; border:0; letter-spacing:-.01em;
    transition:background .25s var(--ease), transform .12s ease-out, box-shadow .3s var(--ease);
  }
  .btn:active{transform:scale(.98)}
  .btn--primary{background:var(--copper); color:var(--night); box-shadow:0 14px 40px -14px rgba(232,162,96,.55);}
  .btn--primary:hover{background:var(--copper-30)}
  .btn--primary:disabled{background:var(--copper-20); cursor:wait}
  .btn--ghost{background:transparent; color:var(--graphite-40); border:1px solid var(--line-strong); padding:13px 24px; font-size:.9rem;}
  .btn--ghost:hover{background:var(--night-90); color:var(--mist)}
  .spinner{width:16px; height:16px; border-radius:50%; border:2px solid rgba(5,7,13,.3);
    border-top-color:var(--night); animation:spin .7s linear infinite; display:none;}
  .btn.is-loading .spinner{display:inline-block}
  .btn.is-loading .btn__label{opacity:.65}
  @keyframes spin{to{transform:rotate(360deg)}}

  .form-error{display:none; max-width:640px; margin:18px auto 0; text-align:center; font-size:.9rem;
    color:#D98A83; background:rgba(181,68,58,.12); border:1px solid rgba(181,68,58,.35);
    border-radius:12px; padding:12px 18px;}
  .form-error.is-visible{display:block}

  /* Danke */
  .done{max-width:640px; margin:0 auto; text-align:center;}
  .done__badge{width:84px; height:84px; margin:10px auto 26px; border-radius:50%;
    border:1px solid rgba(232,162,96,.4); display:grid; place-items:center;
    background:radial-gradient(circle, rgba(232,162,96,.16), transparent 70%);}
  .done__badge svg{color:var(--copper)}
  .done__badge svg path{stroke-dasharray:34; stroke-dashoffset:34; animation:draw .7s .35s var(--ease) forwards;}
  @keyframes draw{to{stroke-dashoffset:0}}
  .done__mail{color:var(--paper); font-weight:600}
  .done-steps{display:grid; gap:0; margin:34px 0 8px; text-align:left;}
  .done-step{display:flex; gap:16px; padding:16px 4px; border-top:1px solid var(--line);}
  .done-step:last-child{border-bottom:1px solid var(--line)}
  .done-step b{flex:none; width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
    border:1px solid var(--copper); color:var(--copper); font-size:.85rem; font-weight:600;}
  .done-step div{font-size:.92rem; color:var(--graphite-40); line-height:1.5; padding-top:3px;}
  .done-step div strong{color:var(--mist); font-weight:600}
  .done__hint{font-size:.8rem; color:var(--graphite-60); margin-top:22px;}
  .done__photo{margin:34px auto 0; max-width:420px; border-radius:18px; overflow:hidden; border:1px solid var(--line);}
  .done__photo img{width:100%; display:block}

  footer{padding:26px 0 34px; display:flex; justify-content:center; gap:26px; font-size:.78rem; color:var(--graphite-60);}
  footer a{color:var(--graphite-60); text-decoration:none}
  footer a:hover{color:var(--mist)}

  .hp{position:absolute; left:-6000px; top:auto; width:1px; height:1px; overflow:hidden;}

  /* Reveal beim ersten Laden */
  .reveal{opacity:0; transform:translateY(22px); animation:reveal .7s var(--ease) forwards;}
  .reveal[data-d="1"]{animation-delay:.08s}.reveal[data-d="2"]{animation-delay:.16s}
  .reveal[data-d="3"]{animation-delay:.24s}.reveal[data-d="4"]{animation-delay:.34s}
  @keyframes reveal{to{opacity:1; transform:none}}

  @media (max-width:760px){
    .split{grid-template-columns:1fr}
    .options{grid-template-columns:1fr}
    .grid-2{grid-template-columns:1fr}
    header{padding-top:18px}
    .actions{flex-direction:column-reverse}
    .btn--primary{width:100%}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important}
    .reveal{opacity:1; transform:none}
    .step.is-active{animation:none}
  }
</style>
</head>

/* ============================== State ============================== */

const state = {
  segment: null,          // "B2C" | "B2B"
  answers: {},            // key → value
  stepIndex: 0,           // 0 = Weiche
  contact: {},
};

const stage = document.getElementById("stage");
const progressEl = document.getElementById("progress");

function questions(){ return state.segment === "B2B" ? B2B_QUESTIONS : B2C_QUESTIONS; }
/* Schritte: 1 Weiche + Fragen + Kontakt */
function totalSteps(){ return 1 + (state.segment ? questions().length : Math.max(B2C_QUESTIONS.length, B2B_QUESTIONS.length)) + 1; }

function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

/* ============================== Rendering ============================== */

function updateProgress(label){
  const total = totalSteps();
  const current = Math.min(state.stepIndex + 1, total);
  progressEl.hidden = false;
  document.getElementById("p-current").textContent = current;
  document.getElementById("p-total").textContent = total;
  document.getElementById("p-label").textContent = label || "";
  const pct = (current - 1) / (total - 1) * 100;
  document.getElementById("p-fill").style.width = pct + "%";
  document.getElementById("p-spark").style.left = pct + "%";
}

function setStep(html, { back = false, label = "" } = {}){
  stage.innerHTML = `<section class="step is-active${back ? " from-back" : ""}">${html}</section>`;
  updateProgress(label);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function ghostBack(){
  return `<button type="button" class="btn btn--ghost" data-back>${ic.arrowLeft}<span>Zurück</span></button>`;
}

/* --- Fragen --- */
function renderQuestion(qIndex, back){
  const q = questions()[qIndex];
  const selected = state.answers[q.key];
  const stack = q.options.some(o => o.v.length > 34);
  const html = `
    <p class="eyebrow">${state.segment === "B2B" ? "Kooperation" : "Ihre Anfrage"}</p>
    <h2>${q.title}</h2>
    <p class="sub">Wählen Sie eine Option — es geht automatisch weiter.</p>
    <div class="options ${stack ? "options--stack" : ""}" role="group" aria-label="${esc(q.label)}">
      ${q.options.map(o => `
        <button type="button" class="option ${selected === o.v ? "is-selected" : ""}" data-value="${esc(o.v)}">
          <span class="option__icon">${o.icon}</span>
          <span>${esc(o.v)}</span>
          <span class="option__check">${ic.check}</span>
        </button>`).join("")}
    </div>
    <div class="actions">${ghostBack()}</div>`;
  setStep(html, { back, label: q.label });
  stage.querySelector("[data-back]").addEventListener("click", () => go(-1));
  stage.querySelectorAll(".option").forEach(el =>
    el.addEventListener("click", () => {
      stage.querySelectorAll(".option").forEach(x => x.classList.remove("is-selected"));
      el.classList.add("is-selected");
      state.answers[q.key] = el.dataset.value;
      setTimeout(() => go(1), 330);
    })
  );
}

    <p class="eyebrow">${isB2B ? "Kooperation" : "Ihre Anfrage"}</p>
    <h2>${isB2B ? "Wie erreichen wir Sie für das <b>Partnergespräch</b>?" : "Wohin dürfen wir Ihre <b>Ersteinschätzung</b> schicken?"}</h2>
    <p class="sub">${isB2B
      ? "Unser Partner-Team meldet sich innerhalb von zwei Werktagen bei Ihnen."
      : "Ein zertifizierter Fachpartner aus Ihrer Region meldet sich innerhalb von zwei Werktagen."}</p>
    <form novalidate>
      <div class="grid-2">
        <div class="field" data-f="firstName"><label for="f-first">Vorname</label>
          <input id="f-first" name="firstName" autocomplete="given-name" placeholder="Max" value="${val("firstName")}">
          <p class="error">Bitte geben Sie Ihren Vornamen an.</p></div>
        <div class="field" data-f="lastName"><label for="f-last">Nachname</label>
          <input id="f-last" name="lastName" autocomplete="family-name" placeholder="Mustermann" value="${val("lastName")}">
          <p class="error">Bitte geben Sie Ihren Nachnamen an.</p></div>
      </div>
      ${isB2B ? `
      <div class="field" data-f="company"><label for="f-company">Firma</label>
        <input id="f-company" name="company" autocomplete="organization" placeholder="Mustermann Elektrotechnik GmbH" value="${val("company")}">
        <p class="error">Bitte geben Sie Ihren Firmennamen an.</p></div>
      <div class="field" data-f="website"><label for="f-web">Website <small>— optional</small></label>
        <input id="f-web" name="website" inputmode="url" autocomplete="url" placeholder="www.ihr-betrieb.de" value="${val("website")}"></div>
      ` : ""}
      <div class="grid-2">
        <div class="field" data-f="postalCode"><label for="f-plz">Postleitzahl</label>
          <input id="f-plz" name="postalCode" inputmode="numeric" autocomplete="postal-code" maxlength="5" placeholder="85435" value="${val("postalCode")}">
          <p class="error">Bitte geben Sie eine gültige Postleitzahl an.</p></div>
        <div class="field" data-f="city"><label for="f-city">Ort <small>— optional</small></label>
          <input id="f-city" name="city" autocomplete="address-level2" placeholder="Erding" value="${val("city")}"></div>
      </div>
      <div class="field" data-f="email"><label for="f-mail">E-Mail</label>
        <input id="f-mail" name="email" type="email" autocomplete="email" placeholder="max.mustermann@beispiel.de" value="${val("email")}">
        <p class="error">Bitte geben Sie eine gültige E-Mail-Adresse an.</p></div>
      <div class="field" data-f="phone"><label for="f-phone">Telefon <small>— optional, für schnellere Rückfragen</small></label>
        <input id="f-phone" name="phone" type="tel" autocomplete="tel" placeholder="+49 8122 5538050" value="${val("phone")}"></div>
      <div class="field" data-f="message"><label for="f-msg">Ihre Nachricht <small>— optional</small></label>
        <textarea id="f-msg" name="message" placeholder="Gibt es etwas, das wir vorab wissen sollten?">${val("message")}</textarea></div>
      <div class="hp" aria-hidden="true"><label>Fax<input name="fax" tabindex="-1" autocomplete="off"></label></div>
      <div class="consent" data-f="consent">
        <input type="checkbox" id="f-consent" ${c.consent ? "checked" : ""}>
        <label for="f-consent">Ich habe die <a href="${PRIVACY_URL}" target="_blank" rel="noopener">Datenschutzerklärung</a> zur Kenntnis genommen und bin einverstanden, dass die Varmova UG meine Angaben zur Bearbeitung meiner Anfrage verarbeitet und mich dazu per E-Mail oder Telefon kontaktiert. Diese Einwilligung kann ich jederzeit widerrufen.*</label>
      </div>
      <div class="actions">
        ${ghostBack()}
        <button type="submit" class="btn btn--primary"><span class="spinner" aria-hidden="true"></span><span class="btn__label">Anfrage absenden</span>${ic.arrowRight}</button>
      </div>
      <p class="form-error" id="form-error" role="alert"></p>
    </form>`;
  setStep(html, { back, label: "Kontakt" });
  stage.querySelector("[data-back]").addEventListener("click", () => go(-1));
  stage.querySelector("form").addEventListener("submit", onSubmit);
}

/* ============================== Navigation ============================== */

function render(back = false, initial = false){
  const qs = state.segment ? questions() : [];
  if (state.stepIndex <= 0 || !state.segment) { state.stepIndex = 0; renderStart(initial); return; }
  if (state.stepIndex <= qs.length) { renderQuestion(state.stepIndex - 1, back); return; }
  renderContact(back);
}

function go(delta){
  state.stepIndex = Math.max(0, state.stepIndex + delta);
  if (delta > 0) history.pushState({ i: state.stepIndex }, "");
  render(delta < 0);
}

window.addEventListener("popstate", (e) => {
  const i = e.state && typeof e.state.i === "number" ? e.state.i : 0;
  const back = i < state.stepIndex;
  state.stepIndex = i;
  render(back);
});

/* ============================== Submit ============================== */

function collect(form){
  const get = n => (form.elements[n] ? form.elements[n].value.trim() : "");
  return {
    firstName: get("firstName"), lastName: get("lastName"),
    company: get("company"), website: get("website"),
    postalCode: get("postalCode"), city: get("city"),
    email: get("email"), phone: get("phone"), message: get("message"),
    fax: get("fax"),
    consent: form.querySelector("#f-consent").checked,
  };
}

function validate(form, c){
  let ok = true;
  const mark = (name, valid) => {
    const field = form.closest ? stage.querySelector(`[data-f="${name}"]`) : null;
    if (field) field.classList.toggle("has-error", !valid);
    if (!valid) ok = false;
  };
  mark("firstName", c.firstName.length > 0);
  mark("lastName", c.lastName.length > 0);
  if (state.segment === "B2B") mark("company", c.company.length > 0);
  mark("postalCode", /^\d{4,5}$/.test(c.postalCode));
  mark("email", /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c.email));
  mark("consent", c.consent);
  return ok;
}

async function onSubmit(e){
  e.preventDefault();
  const form = e.currentTarget;
  const errorBox = document.getElementById("form-error");
  errorBox.classList.remove("is-visible");
  const c = collect(form);
  state.contact = c;
  if (!validate(form, c)) {
    const firstError = stage.querySelector(".has-error input, .has-error");
    if (firstError) firstError.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const btn = form.querySelector(".btn--primary");
  btn.classList.add("is-loading"); btn.disabled = true;

  const payload = {
    segment: state.segment,
    ...state.answers,
    firstName: c.firstName, lastName: c.lastName,
    company: c.company, website: c.website,
    postalCode: c.postalCode, city: c.city,
    email: c.email, phone: c.phone, message: c.message,
    consent: c.consent === true,
    fax: c.fax,
  };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    state.stepIndex += 1;
    history.pushState({ i: state.stepIndex, done: true }, "");
    renderDone();
  } catch (err) {
    console.error(err);
    btn.classList.remove("is-loading"); btn.disabled = false;
    errorBox.textContent = "Ihre Anfrage konnte gerade nicht übertragen werden. Bitte versuchen Sie es in einem Moment erneut — Ihre Angaben bleiben erhalten.";
    errorBox.classList.add("is-visible");
  }
}

/* ============================== Start ============================== */
/* Deep-Link von Landingpages/Ads: ?s=b2b bzw. ?s=b2c überspringt die Weiche. */
const preset = new URLSearchParams(location.search).get("s");
if (preset === "b2b" || preset === "b2c") {
  state.segment = preset.toUpperCase();
  state.stepIndex = 1;
}
history.replaceState({ i: state.stepIndex }, "");
render(false, state.stepIndex === 0);
</script>
